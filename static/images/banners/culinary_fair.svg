<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Wine & Culinary motifs -->
  <circle cx="660" cy="220" r="120" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.35" />
  <circle cx="660" cy="220" r="70" fill="url(#amberGrad)" opacity="0.15" />
  <circle cx="610" cy="180" r="15" fill="#FCD34D" opacity="0.6" />
  <circle cx="640" cy="160" r="10" fill="#FCD34D" opacity="0.6" />
  <circle cx="670" cy="190" r="12" fill="#FCD34D" opacity="0.6" />

  <!-- Content Overlay -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="70" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="1">GASTRONOMY</text>
    
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Epicurean Artisan</text>
    <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#amberGrad)" letter-spacing="-1">Food &amp; Wine Fair</text>
    
    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="16" fill="#FDE68A">60+ Vintners • Michelin Guest Chefs • Gourmet Pairing</text>
    
    <g transform="translate(0, 230)">
      <circle cx="10" cy="0" r="4" fill="#F59E0B" />
      <text x="22" y="4" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Silverado Vineyard Estates, Napa Valley CA</text>
    </g>
  </g>
</svg>
