<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A2E" />
      <stop offset="50%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#701A75" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Stage Lights & Rays -->
  <polygon points="100,0 200,450 0,450" fill="#EC4899" opacity="0.12" />
  <polygon points="700,0 800,450 600,450" fill="#8B5CF6" opacity="0.15" />
  <polygon points="400,0 550,450 250,450" fill="#F59E0B" opacity="0.08" />

  <!-- Waveform Visualizer -->
  <g transform="translate(480, 260)" opacity="0.7">
    <rect x="0" y="40" width="6" height="60" rx="3" fill="#F43F5E" />
    <rect x="14" y="20" width="6" height="80" rx="3" fill="#EC4899" />
    <rect x="28" y="0" width="6" height="100" rx="3" fill="#A855F7" />
    <rect x="42" y="30" width="6" height="70" rx="3" fill="#F59E0B" />
    <rect x="56" y="10" width="6" height="90" rx="3" fill="#EC4899" />
    <rect x="70" y="45" width="6" height="55" rx="3" fill="#06B6D4" />
    <rect x="84" y="25" width="6" height="75" rx="3" fill="#F43F5E" />
    <rect x="98" y="15" width="6" height="85" rx="3" fill="#A855F7" />
    <rect x="112" y="35" width="6" height="65" rx="3" fill="#EC4899" />
    <rect x="126" y="5" width="6" height="95" rx="3" fill="#F59E0B" />
    <rect x="140" y="25" width="6" height="75" rx="3" fill="#F43F5E" />
    <rect x="154" y="45" width="6" height="55" rx="3" fill="#8B5CF6" />
    <rect x="168" y="15" width="6" height="85" rx="3" fill="#EC4899" />
    <rect x="182" y="30" width="6" height="70" rx="3" fill="#06B6D4" />
  </g>

  <!-- Content Overlay -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(244, 63, 94, 0.2)" stroke="#F43F5E" stroke-width="1.5" />
    <text x="70" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FDA4AF" text-anchor="middle" letter-spacing="1">LIVE CONCERT</text>
    
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Neon Horizon</text>
    <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#neonPink)" letter-spacing="-1">Indie Music Fest</text>
    
    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="16" fill="#D8B4FE">45 Artists • 3 Stages • Sunset Outdoor Sessions</text>
    
    <g transform="translate(0, 230)">
      <circle cx="10" cy="0" r="4" fill="#F59E0B" />
      <text x="22" y="4" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Zilker Metropolitan Park, Austin TX</text>
    </g>
  </g>
</svg>
