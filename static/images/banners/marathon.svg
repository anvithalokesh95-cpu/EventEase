<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Speed Lines & Sun -->
  <circle cx="680" cy="180" r="100" fill="url(#orangeGrad)" opacity="0.3" />
  <line x1="450" y1="280" x2="780" y2="280" stroke="#FB923C" stroke-width="4" stroke-dasharray="20 15" opacity="0.4" />
  <line x1="500" y1="310" x2="750" y2="310" stroke="#FBBF24" stroke-width="3" stroke-dasharray="15 10" opacity="0.3" />
  <line x1="480" y1="340" x2="720" y2="340" stroke="#F97316" stroke-width="2" stroke-dasharray="30 20" opacity="0.25" />

  <!-- Content Overlay -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(251, 146, 60, 0.2)" stroke="#FB923C" stroke-width="1.5" />
    <text x="70" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FDBA74" text-anchor="middle" letter-spacing="1">ATHLETICS &amp; RUN</text>
    
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Coastal Sun</text>
    <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#orangeGrad)" letter-spacing="-1">Marathon &amp; Expo</text>
    
    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="16" fill="#FED7AA">Full, Half &amp; 10K Scenic Oceanfront Routes • Medals &amp; Festival</text>
    
    <g transform="translate(0, 230)">
      <circle cx="10" cy="0" r="4" fill="#F97316" />
      <text x="22" y="4" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Mission Bay Waterfront, San Diego CA</text>
    </g>
  </g>
</svg>
