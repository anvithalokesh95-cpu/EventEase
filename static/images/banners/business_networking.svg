<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Modern Architectural Graphic Lines -->
  <polygon points="550,50 780,250 680,450 450,250" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="2" />
  <polygon points="500,100 730,300 630,500 400,300" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="1.5" />
  <circle cx="615" cy="250" r="80" fill="url(#goldGrad)" opacity="0.12" />

  <!-- Content Overlay -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="70" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">INVESTMENT &amp; VC</text>
    
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">VentureConnect</text>
    <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" letter-spacing="-1">Pitch &amp; Angel Gala</text>
    
    <text x="0" y="195" font-family="'Inter', sans-serif" font-size="16" fill="#94A3B8">Top 50 Founders • Angel Syndicate • Closed-Door Roundtables</text>
    
    <g transform="translate(0, 230)">
      <circle cx="10" cy="0" r="4" fill="#10B981" />
      <text x="22" y="4" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Manhattan Skyline Ballroom, New York NY</text>
    </g>
  </g>
