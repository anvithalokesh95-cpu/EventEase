{% extends "base.html" %}

{% block title %}Create Account - EventEase{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 4rem; padding-bottom: 5rem; max-width: 520px;">
  
  <div style="background: #FFFFFF; border-radius: var(--radius-xl); border: 1px solid var(--border-color); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; background: var(--secondary-light); color: var(--secondary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem;">
        <i class="fas fa-user-plus"></i>
      </div>
      <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.35rem;">Join EventEase</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Create your free attendee profile to register for events</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" onsubmit="return validateRegisterForm(this)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Jane Doe" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="jane.doe@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number (Optional)</label>
        <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 123-4567">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" id="regPassword" class="form-control" placeholder="Min 6 chars" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control" placeholder="Repeat password" required>
        </div>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" required style="margin-top: 3px;">
          <span>I agree to the EventEase Terms of Service and Privacy Policy.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="fas fa-user-check"></i> Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
      <p style="color: var(--text-muted);">
        Already registered? 
        <a href="{{ url_for('login') }}" style="font-weight: 700;">Sign in here</a>
      </p>
    </div>

  </div>
</div>

<script>
  function validateRegisterForm(form) {
    const pw = document.getElementById('regPassword').value;
    const confirmPw = document.getElementById('regConfirmPassword').value;
    if (pw !== confirmPw) {
      alert('Passwords do not match. Please verify and try again.');
      return false;
    }
    return true;
  }
</script>
{% endblock %}
